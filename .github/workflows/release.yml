name: release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --no-sign --target universal-apple-darwin --bundles dmg
          - platform: ubuntu-22.04
            args: --no-sign --bundles deb,appimage
          - platform: windows-latest
            args: --no-sign --bundles nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Помодоро v__VERSION__"
          releaseBody: |
            Файлы без платной подписи.

            - Windows: установщик `.exe`
            - macOS: `.dmg` для Intel и Apple Silicon
            - Linux: `.deb` и `.AppImage`

            Windows может написать, что издатель неизвестен. На Mac откройте файл через правый клик и пункт «Открыть».
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
